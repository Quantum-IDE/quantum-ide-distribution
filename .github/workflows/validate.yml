name: Validate Distribution Manifests and Integrity

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Integrity Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Real JSON Schema Validation (Ajv 8 Draft-07)
        run: |
          node scripts/verify-manifest.js

      - name: Run Positive & Negative Schema Test Suite (10 Cases)
        run: |
          node scripts/test-manifest-validation.js
